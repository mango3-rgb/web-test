    <script>
      (function() {
        var color = document.cookie.match(/(?:^|; )colorTheme=([^;]+)/);
        var theme = document.cookie.match(/(?:^|; )themeMode=([^;]+)/);
        var validColors = ['arctic','autumn'];
        document.documentElement.setAttribute('data-color', color && validColors.includes(color[1]) ? color[1] : 'arctic');
        var mode = theme ? theme[1] : 'dark';
        if (mode === 'auto') {
          var h = new Date().getHours();
          mode = (h >= 6 && h < 18) ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
      })();
    </script>
